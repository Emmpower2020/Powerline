<?xml version="1.0" encoding="UTF-8"?>
<!-- آیکون برنامه: سیستم مدیریت خطوط ایلیا — دکل انتقال برق روی گرادیان بنفش -->
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>

  <!-- پس‌زمینه گوشه‌گرد -->
  <rect x="1" y="1" width="30" height="30" rx="7" fill="url(#bg)"/>

  <!-- بدنه دکل (هرم شبکه‌ای) -->
  <g stroke="#FFFFFF" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- پایه‌های اصلی -->
    <path d="M16 5.2 L10.6 28"/>
    <path d="M16 5.2 L21.4 28"/>
    <!-- پای افقی -->
    <path d="M9.2 28 H22.8"/>
    <!-- بازوی بالا (پهن) -->
    <path d="M6.8 10.6 H25.2"/>
    <!-- بازوی پایین (باریک‌تر) -->
    <path d="M9.6 15.4 H22.4"/>
    <!-- مهاربندی ضربدری -->
    <path d="M14.1 10.6 L17.9 13.2 L14.4 15.4 L18 18.4 L14.8 20.8 L18.2 24.2" stroke-width="1.3"/>
  </g>

  <!-- مقره‌ها (تیک‌های عمودی روی بازوها) -->
  <g stroke="#FDE047" stroke-width="1.5" stroke-linecap="round">
    <path d="M6.8 10.6 V13.4"/>
    <path d="M16 10.6 V13.4"/>
    <path d="M25.2 10.6 V13.4"/>
  </g>

  <!-- قوس برق (جرقه) بالای دکل -->
  <path d="M17.6 2.4 L15.4 5 L17.2 5 L15.9 7.6" stroke="#FDE047" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
